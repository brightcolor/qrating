server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://backend:4000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Backend unreachable (restart, crash): answer in the format of the API.
    error_page 502 503 504 = @api_unavailable;
  }

  location @api_unavailable {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 503 '{"error":"qrating ist gerade nicht erreichbar, vermutlich startet der Server neu. Bitte versuche es gleich erneut."}';
  }

  # Vite puts a content hash into every file name below /assets/.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The short domain carries the QR codes; its start page belongs to the website.
  # A link with parameters keeps its target, so campaign tracking stays intact.
  location = / {
    set $website_start 0;
    if ($host ~* ^(www\.)?qrat\.ing$) {
      set $website_start 1;
    }
    if ($args) {
      set $website_start 0;
    }
    if ($website_start = 1) {
      return 301 https://qrating.de/;
    }
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
