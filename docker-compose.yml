services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qrating}
      POSTGRES_USER: ${POSTGRES_USER:-qrating}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qrating}
    volumes:
      # A path such as ./data/postgres gives a bind mount; the default keeps the named volume of older installs.
      - ${POSTGRES_DATA:-postgres-data}:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qrating} -d ${POSTGRES_DB:-qrating}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgres://${POSTGRES_USER:-qrating}:${POSTGRES_PASSWORD:-qrating}@postgres:5432/${POSTGRES_DB:-qrating}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      ADMIN_APP_URL: ${ADMIN_APP_URL:-}
      FEEDBACK_APP_URL: ${FEEDBACK_APP_URL:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # No example secrets here: with NODE_ENV=production the backend starts only with real ones.
      SESSION_SECRET: ${SESSION_SECRET:-}
      PRETIX_TOKEN_SECRET: ${PRETIX_TOKEN_SECRET:-}
      SYSTEM_SMTP_PASSWORD: ${SYSTEM_SMTP_PASSWORD:-}
      ORGANIZATION_NAME: ${ORGANIZATION_NAME:-}
      ORGANIZATION_SLUG: ${ORGANIZATION_SLUG:-}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-}
      IMAGE_CACHE_MAX_BYTES: ${IMAGE_CACHE_MAX_BYTES:-}
      WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS:-}
      PRETIX_SCHEDULER_INTERVAL_MS: ${PRETIX_SCHEDULER_INTERVAL_MS:-}
      # PORT stays out: the API listens on 4000 inside the container, where nginx and the port binding below expect it.
      ADMIN_SESSION_HOURS: ${ADMIN_SESSION_HOURS:-}
      TWO_FACTOR_CHALLENGE_MINUTES: ${TWO_FACTOR_CHALLENGE_MINUTES:-}
      PASSWORD_RESET_VALID_HOURS: ${PASSWORD_RESET_VALID_HOURS:-}
      INVITE_VALID_DAYS: ${INVITE_VALID_DAYS:-}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-}
      AUTH_RATE_LIMIT_WINDOW_MINUTES: ${AUTH_RATE_LIMIT_WINDOW_MINUTES:-}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-}
      PASSWORD_RESET_RATE_LIMIT_WINDOW_MINUTES: ${PASSWORD_RESET_RATE_LIMIT_WINDOW_MINUTES:-}
      PASSWORD_RESET_RATE_LIMIT_MAX: ${PASSWORD_RESET_RATE_LIMIT_MAX:-}
      SETUP_CODE_LENGTH: ${SETUP_CODE_LENGTH:-}
      SYSTEM_SMTP_PORT: ${SYSTEM_SMTP_PORT:-}
      RETENTION_MIN_DAYS: ${RETENTION_MIN_DAYS:-}
      RETENTION_MAX_DAYS: ${RETENTION_MAX_DAYS:-}
      RETENTION_PHONE_DEFAULT_DAYS: ${RETENTION_PHONE_DEFAULT_DAYS:-}
      RETENTION_INTERVAL_HOURS: ${RETENTION_INTERVAL_HOURS:-}
      JOB_RETRY_MINUTES: ${JOB_RETRY_MINUTES:-}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-}
      PRETIX_SYNC_MAX_ATTEMPTS: ${PRETIX_SYNC_MAX_ATTEMPTS:-}
      RETENTION_JOB_MAX_ATTEMPTS: ${RETENTION_JOB_MAX_ATTEMPTS:-}
      SCHEDULER_BATCH_SIZE: ${SCHEDULER_BATCH_SIZE:-}
      JOB_HISTORY_DAYS: ${JOB_HISTORY_DAYS:-}
      LOW_RATING_GRACE_MINUTES: ${LOW_RATING_GRACE_MINUTES:-}
      ANALYTICS_VOICES_LIMIT: ${ANALYTICS_VOICES_LIMIT:-}
      ANALYTICS_COMMENTS_LIMIT: ${ANALYTICS_COMMENTS_LIMIT:-}
      ANALYTICS_ABANDONED_LIMIT: ${ANALYTICS_ABANDONED_LIMIT:-}
      CALLBACKS_LIST_LIMIT: ${CALLBACKS_LIST_LIMIT:-}
      REPORT_COMMENTS_LIMIT: ${REPORT_COMMENTS_LIMIT:-}
      QR_SOURCE_LABEL_MAX_LENGTH: ${QR_SOURCE_LABEL_MAX_LENGTH:-}
      QR_SOURCE_SLUG_MAX_LENGTH: ${QR_SOURCE_SLUG_MAX_LENGTH:-}
      UPCOMING_EVENTS_MAX: ${UPCOMING_EVENTS_MAX:-}
      UPCOMING_EVENTS_AUTO_COUNT: ${UPCOMING_EVENTS_AUTO_COUNT:-}
      ORGANIZATION_PAGE_UPCOMING_COUNT: ${ORGANIZATION_PAGE_UPCOMING_COUNT:-}
      FEEDBACK_WINDOW_MAX_DAYS: ${FEEDBACK_WINDOW_MAX_DAYS:-}
      FEEDBACK_WINDOW_MAX_HOURS: ${FEEDBACK_WINDOW_MAX_HOURS:-}
      WALLBOARD_REFRESH_DEFAULT_SECONDS: ${WALLBOARD_REFRESH_DEFAULT_SECONDS:-}
      WALLBOARD_REFRESH_MIN_SECONDS: ${WALLBOARD_REFRESH_MIN_SECONDS:-}
      WALLBOARD_REFRESH_MAX_SECONDS: ${WALLBOARD_REFRESH_MAX_SECONDS:-}
      ADMIN_COOKIE_NAME: ${ADMIN_COOKIE_NAME:-}
      SETUP_CODE_COMMAND: ${SETUP_CODE_COMMAND:-}
      RESET_LINK_COMMAND: ${RESET_LINK_COMMAND:-}
      SYSTEM_SMTP_HOST: ${SYSTEM_SMTP_HOST:-}
      SYSTEM_SMTP_SECURE: ${SYSTEM_SMTP_SECURE:-}
      SYSTEM_SMTP_USER: ${SYSTEM_SMTP_USER:-}
      SYSTEM_MAIL_FROM: ${SYSTEM_MAIL_FROM:-}
      NEW_ORGANIZATION_COLOR: ${NEW_ORGANIZATION_COLOR:-}
      NEW_ORGANIZATION_PRIVACY_TEXT: ${NEW_ORGANIZATION_PRIVACY_TEXT:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
    ports:
      - "${BACKEND_PORT:-127.0.0.1:4000}:4000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  postgres-data:
